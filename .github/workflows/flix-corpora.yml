name: Flix corpora
# Heavy checks against real Flix code, weekly and on demand (not on every push):
#   1. the formatter invariants over the test sources of flix/flix at the release flix-spec pins,
#      the Flix snippets embedded in its Scala tests, and the open issues of the maintainer;
#   2. the compiler oracle: the pinned flix.jar must report the same diagnostics and test results
#      for a sample of those sources before and after formatting.
on:
  schedule:
    - cron: "47 4 * * 2"
  workflow_dispatch:
    inputs:
      every:
        description: "Compiler oracle: check every n-th file (1 = all, slow)"
        default: "8"
permissions:
  contents: read
jobs:
  corpora:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wstein/flix-spec
          path: flix-spec
      - name: Read the Flix release pinned by flix-spec
        id: pin
        run: |
          echo "tag=$(node -p "require('./flix-spec/pin.json').upstream.tag")" >> "$GITHUB_OUTPUT"
          echo "jar=$(node -p "require('./flix-spec/pin.json').oracleArtifact.url")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: flix/flix
          ref: ${{ steps.pin.outputs.tag }}
          path: flix-src
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: npm ci
      - run: npm run build
      - name: Collect the snippets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/harvest-scala.mjs flix-src scala-snippets
          node scripts/harvest-issues.mjs issue-snippets
      - name: Formatter invariants over the corpora
        run: node scripts/check-corpus.mjs flix-src/main/test/flix scala-snippets issue-snippets
      - name: Download the pinned compiler
        run: curl -fsSL -o flix.jar "${{ steps.pin.outputs.jar }}"
      - name: Compiler oracle
        run: node scripts/oracle.mjs flix.jar flix-src/main/test/flix --every "${{ inputs.every || 8 }}" --jobs 2 --pin flix-spec/pin.json
