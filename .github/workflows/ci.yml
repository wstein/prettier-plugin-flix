name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The grammar is a git dependency; its lockfile entry uses ssh, which CI has no key for.
      - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      - name: Check Markdown fixture syntax coverage
        run: npm run coverage:syntax -- --check
