name: Publish plugin release

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full SHA of the release commit on main. Defaults to the commit that starts this run.
        type: string
      publish_npm:
        description: Also publish to npm after Trusted Publishing is configured.
        type: boolean
        default: false
      flix_tag:
        description: Exact Flix release tag for the standard-library compile gate.
        type: string
        default: v0.80.0

permissions:
  contents: read

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.package.outputs.version }}
      commit: ${{ steps.package.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the release commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
        run: |
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || ! git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD; then
            echo 'The release commit must be a full SHA in the history of main.'
            exit 1
          fi
          git checkout --detach "$SOURCE_COMMIT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check npm publishing opt-in
        if: inputs.publish_npm
        run: |
          if [[ "$(node -p 'require("./package.json").private === true')" == true ]]; then
            echo 'This commit still marks the package private in package.json.' >&2
            exit 1
          fi
      - name: Check CHANGELOG and npm version
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable plugin version in package.json.' >&2
            exit 1
          fi
          if ! grep -qE "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md must contain a '## [${version}]' heading before release." >&2
            exit 1
          fi
          if npm view "prettier-plugin-flix@$version" version >/dev/null 2>&1; then
            echo "prettier-plugin-flix@$version is already on npm." >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Verify reviewed changelog notes
        run: node scripts/check-release-changelog.mjs
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      - run: npm run coverage:syntax -- --check
      - name: Install Hugo
        env:
          HUGO_VERSION: 0.154.5
          HUGO_SHA256: 99b2f2f3db3e65bbbdb5840bc5158e271975b17d152904bb750ebae3c2a2aecc
        run: |
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}" -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$HUGO_SHA256" "$RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - run: npm run docs:build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run docs:test:browser
      - name: Download the Flix compiler
        id: compiler
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.flix_tag || 'v0.80.0' }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a Flix release tag such as v0.80.0." >&2
            exit 1
          fi
          release=$(gh api "repos/flix/flix/releases/tags/$REQUESTED_TAG")
          tag=$(jq -er '.tag_name' <<< "$release")
          jar="$RUNNER_TEMP/flix.jar"
          gh release download "$tag" --repo flix/flix --pattern flix.jar --output "$jar"
          digest=$(jq -r '.assets[] | select(.name == "flix.jar") | .digest // empty' <<< "$release")
          if [[ -n "$digest" ]]; then
            printf '%s  %s\n' "${digest#sha256:}" "$jar" | sha256sum --check
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Format and compile the bundled standard library
        env:
          FLIX_TAG: ${{ steps.compiler.outputs.tag }}
        run: bash scripts/check-flix-stdlib.sh "$RUNNER_TEMP/flix.jar" "$FLIX_TAG"
      - name: Pack the release
        id: package
        run: |
          version=$(node -p 'require("./package.json").version')
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"
          printf 'version=%s\ncommit=%s\n' "$version" "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Smoke-test the packed plugin
        run: |
          prettier_version=$(node -p 'require("./node_modules/prettier/package.json").version')
          smoke_dir=$(mktemp -d)
          cd "$smoke_dir"
          npm init --yes > /dev/null
          npm install --no-audit --no-fund "prettier@$prettier_version" "$RUNNER_TEMP/package/"*.tgz
          printf 'def smoke():Int32=42\n' > Smoke.flix
          npm exec -- prettier --plugin prettier-plugin-flix --write Smoke.flix
          diff -u <(printf 'def smoke(): Int32 = 42\n') Smoke.flix
          npm exec -- prettier --plugin prettier-plugin-flix --check Smoke.flix
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: ${{ runner.temp }}/package/*.tgz
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-package
          path: ${{ runner.temp }}/package
      - name: Upload and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
          TARGET_COMMIT: ${{ needs.package.outputs.commit }}
        run: |
          tag="v$PACKAGE_VERSION"
          name="prettier-plugin-flix-$PACKAGE_VERSION.tgz"
          package="$RUNNER_TEMP/package/$name"

          # GitHub ignores --target for a tag that already exists.
          refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$tag")
          tagged=$(jq -c --arg ref "refs/tags/$tag" 'first(.[] | select(.ref == $ref) | .object) // empty' <<< "$refs")
          if [[ -n "$tagged" ]]; then
            while [[ $(jq -r '.type' <<< "$tagged") == tag ]]; do
              sha=$(jq -er '.sha' <<< "$tagged")
              tagged=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .object)
            done
            if ! jq -e --arg commit "$TARGET_COMMIT" '.type == "commit" and .sha == $commit' <<< "$tagged" > /dev/null; then
              echo "Existing tag $tag does not point to release commit $TARGET_COMMIT." >&2
              exit 1
            fi
          fi

          if ! release=$(gh release view "$tag" --json isDraft,targetCommitish,body,assets); then
            echo "Create and review a release draft for $tag before publishing." >&2
            exit 1
          fi
          if ! jq -e --arg commit "$TARGET_COMMIT" '
            .isDraft and .targetCommitish == $commit and (.body | test("\\S"))
          ' <<< "$release" > /dev/null; then
            echo "Release $tag must be a draft with release notes targeting $TARGET_COMMIT." >&2
            exit 1
          fi
          if jq -e --arg name "$name" 'any(.assets[]; .name == $name)' <<< "$release" > /dev/null; then
            gh release download "$tag" --pattern "$name" --dir "$RUNNER_TEMP/existing"
            cmp "$package" "$RUNNER_TEMP/existing/$name"
          else
            gh release upload "$tag" "$package"
          fi
          gh release edit "$tag" --draft=false --latest

  publish_npm:
    if: inputs.publish_npm
    needs: [package, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-package
          path: ${{ runner.temp }}/package
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing (OIDC) needs npm >= 11.5.1; Node 22 bundles npm 10.x.
      - run: npm install -g npm@11.6.2
      - name: Publish the verified tarball to npm
        env:
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          package="$RUNNER_TEMP/package/prettier-plugin-flix-$PACKAGE_VERSION.tgz"
          npm publish "$package" --provenance --access public
