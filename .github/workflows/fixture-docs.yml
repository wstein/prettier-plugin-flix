name: Fixture documentation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fixture-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/
          npm ci
      - name: Install Hugo
        env:
          HUGO_VERSION: 0.154.5
          HUGO_SHA256: 99b2f2f3db3e65bbbdb5840bc5158e271975b17d152904bb750ebae3c2a2aecc
        run: |
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}" -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$HUGO_SHA256" "$RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/hugo"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/hugo" hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"
      - run: npm run docs:build
      - name: Generate coverage badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm run test:coverage
          node scripts/coverage-badges.mjs coverage.lcov docs/public/coverage
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Smoke-test the built site in Chromium
        run: npm run docs:test:browser
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
