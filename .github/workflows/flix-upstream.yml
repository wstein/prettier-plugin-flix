name: Flix upstream check
# Detects Flix language changes: runs the formatter's invariants (re-parse, same tokens and tree
# shape, idempotent) over the current wstein/flix-spec corpus using the locked plugin grammar.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wstein/flix-spec
          path: flix-spec
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: npm ci
      - run: npm run build
      - name: Corpus gate
        run: node scripts/check-corpus.mjs flix-spec/fixtures/positive flix-spec/profiles/sources
