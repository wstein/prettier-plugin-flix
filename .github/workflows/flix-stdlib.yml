name: Flix standard library compilation

on:
  pull_request:
    paths:
      - '.github/workflows/flix-stdlib.yml'
      - 'scripts/check-flix-stdlib.sh'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/flix-stdlib.yml'
      - 'scripts/check-flix-stdlib.sh'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
  schedule:
    - cron: '37 5 * * 1'
  workflow_dispatch:
    inputs:
      flix_tag:
        description: Exact Flix release tag (default v0.80.0).
        type: string
        default: v0.80.0
  workflow_call:
    inputs:
      flix_tag:
        description: Exact Flix release tag used when packaging a release.
        type: string
        required: false
        default: v0.80.0

permissions:
  contents: read

concurrency:
  group: flix-stdlib-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: git config --global url."https://github.com/".insteadOf ssh://git@github.com/
      - run: npm ci
      - run: npm run build
      - name: Download the Flix compiler
        id: compiler
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.flix_tag || 'v0.80.0' }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a Flix release tag such as v0.80.0." >&2
            exit 1
          fi
          release=$(gh api "repos/flix/flix/releases/tags/$REQUESTED_TAG")
          tag=$(jq -er '.tag_name' <<< "$release")
          jar="$RUNNER_TEMP/flix.jar"
          gh release download "$tag" --repo flix/flix --pattern flix.jar --output "$jar"
          digest=$(jq -r '.assets[] | select(.name == "flix.jar") | .digest // empty' <<< "$release")
          if [[ -n "$digest" ]]; then
            printf '%s  %s\n' "${digest#sha256:}" "$jar" | sha256sum --check
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Format and compile the bundled standard library
        env:
          FLIX_TAG: ${{ steps.compiler.outputs.tag }}
        run: bash scripts/check-flix-stdlib.sh "$RUNNER_TEMP/flix.jar" "$FLIX_TAG"
