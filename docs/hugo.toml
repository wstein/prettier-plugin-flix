baseURL = "https://wstein.github.io/prettier-plugin-flix/"
languageCode = "en"
title = "Prettier Plugin for Flix"
disableKinds = ["taxonomy", "term", "RSS"]

# Exact Flix pin this catalog build documents. Empty means use playground.json.
[params]
flixDocVersion = ""

[build]
noJSConfigInAssets = true

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "../dist"
target = "assets/formatter"

[[module.mounts]]
source = "syntax"
target = "assets/syntax"

[[module.mounts]]
source = "../branding"
target = "static/branding"
includeFiles = ["favicon.ico", "favicon.svg", "apple-touch-icon.png"]
