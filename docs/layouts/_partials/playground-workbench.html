<div class="playground" {{ if .full }}data-full-playground data-examples="{{ .examples.RelPermalink }}" data-linked-fixtures="{{ .linked.RelPermalink }}"{{ end }} data-formatter="{{ .assets.formatter.RelPermalink }}" data-worker="{{ .assets.worker.RelPermalink }}">
  <div class="playground-toolbar">
    {{ if .full }}<label class="playground-example">Example
      <select id="playground-example" disabled><option value="" disabled hidden>Choose an example</option></select>
    </label>{{ end }}
    <label>Line width <input id="print-width" type="number" min="1" step="1" required value="80"></label>
    <label>Indent <input id="tab-width" type="number" min="1" step="1" required value="4"></label>
    {{ if .full }}<button type="button" class="playground-clear">Clear input</button>{{ end }}
    <button type="button" class="playground-copy" disabled>Copy output</button>
  </div>
  <div class="playground-panes">
    <section class="playground-pane">
      <h2 id="flix-input-label">Flix input</h2>
      <div id="flix-input" class="playground-editor"></div>
    </section>
    <section class="playground-pane">
      <div class="playground-preview-header">
        <h2 id="flix-output-label">Preview</h2>
        <div class="playground-preview-modes" role="group" aria-label="Preview mode">
          <button type="button" data-preview-mode="formatted" aria-controls="flix-output" aria-pressed="true">Formatted</button>
          <button type="button" data-preview-mode="diff" aria-controls="flix-diff" aria-pressed="false">Diff</button>
        </div>
      </div>
      <div id="flix-output" class="playground-editor"></div>
      <div id="flix-diff" class="playground-diff" role="region" aria-label="Formatting differences" tabindex="0" hidden></div>
    </section>
  </div>
  <p class="playground-status" role="status">Loading the editor…</p>
</div>
