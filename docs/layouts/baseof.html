<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ site.Title }}</title>
  {{ $stylesheet := resources.Get "css/catalog.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $stylesheet.RelPermalink }}" integrity="{{ $stylesheet.Data.Integrity }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
      <a href="https://github.com/wstein/prettier-plugin-flix">GitHub</a>
    </div>
  </header>
  <div class="site-shell">
    <nav class="chapter-nav" aria-label="Chapters">
      <p class="chapter-nav-title">Chapters</p>
      <ul>
        {{ $current := . }}
        {{ range site.Sections }}
        <li><a href="{{ .RelPermalink }}"{{ if eq .RelPermalink $current.RelPermalink }} aria-current="page"{{ end }}>{{ .Title }}</a></li>
        {{ end }}
      </ul>
    </nav>
    <main>{{ block "main" . }}{{ end }}</main>
  </div>
</body>
</html>
